<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autonomous</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.min.js",
    "three/addons/": "/static/vendor/"
  }
}
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="health-dot" aria-hidden="true"></span>
    <h1>Autonomous</h1>
  </div>
  <div class="topbar-meta">
    <span class="live"><span class="dot" id="live-dot" title="Connecting…"></span>live</span>
    <span id="provider-chip" class="chip">…</span>
    <span id="watcher-chips" class="chips"></span>
  </div>
</header>

<main class="panel">

  <section class="board engine-board" aria-labelledby="engine-heading">
    <div class="board-head">
      <h2 id="engine-heading">Daily brief</h2>
      <div class="board-actions">
        <span class="board-meta" id="brief-meta"></span>
        <button type="button" class="ghost" id="refresh-brief">Regenerate</button>
      </div>
    </div>

    <div class="engine">
      <div class="stage" id="engine-stage" aria-hidden="true"></div>
      <!-- Keyboard-reachable equivalent of the cylinders, and the fallback
           when WebGL is unavailable. -->
      <div class="bank" id="engine" role="tablist" aria-label="Branches of interest"></div>
    </div>
    <div class="engine-bar">
      <p class="hint engine-hint" id="engine-hint">Drag to rotate · hover a cylinder · click to read that branch</p>
      <label class="toggle"><input type="checkbox" id="cutaway"> cutaway</label>
    </div>
  </section>

  <section class="board" id="branch-board" aria-labelledby="branch-heading" hidden>
    <div class="board-head">
      <h2 id="branch-heading">Branch</h2>
      <span class="board-meta" id="branch-meta"></span>
    </div>
    <div id="branch-brief" class="brief"></div>
    <h3 class="subhead">Latest levels</h3>
    <div id="branch-quotes" class="tiles"></div>
    <h3 class="subhead">Sources</h3>
    <ul id="branch-sources" class="stream"></ul>
  </section>

  <section class="board" aria-labelledby="task-heading">
    <div class="board-head"><h2 id="task-heading">Ask something</h2></div>
    <form id="run-form">
      <textarea id="goal" rows="2"
        placeholder="e.g. Dig into why the Nasdaq fell today."></textarea>
      <div class="form-row">
        <button type="submit" id="submit">Run</button>
        <span class="hint" id="run-hint"></span>
      </div>
    </form>
    <div id="run-detail" class="transcript" hidden></div>
    <h3 class="subhead">Recent runs</h3>
    <ul id="runs" class="stream compact"></ul>
  </section>

</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
